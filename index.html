  const i=document.querySelector("#pinfo");if(i)i.textContent=fmt(arr.length)+" visits in view \u00b7 each pin is one visit"},

 _click(e){const b=this._hit(e);if(b){S.sel=[b[1].v.lat,b[1].v.lng];L.popup({maxWidth:320,minWidth:250,offset:[0,-this._h*.7]}).setLatLng([b[1].la,b[1].lo]).setContent(pop(b[1].v)).openOn(this._m)}},

function mapInit(){const m=S.map=L.map("mp",{zoomControl:false,minZoom:4}).setView([21.5,56.5],6);S.bi=0;S.bl=L.tileLayer(BASES[0][1],{maxZoom:19,attribution:"Esri / OSM / CARTO"}).addTo(m);
 S.lab=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:19}).addTo(m);L.control.scale({position:"bottomleft"}).addTo(m);
 S.PL=S.PL||makePinLayer();S.pl=new S.PL().addTo(m);S.pts=[];S.heatOn=false;S.heat=null;S.sel=null;document.onfullscreenchange=()=>setTimeout(()=>S.map&&S.map.invalidateSize(),250)}
function mapRefresh(a){const m=S.map;if(!m)return;const seen={},pts=[];
 a.filter(hasLoc).forEach(v=>{const k=(+v.lat).toFixed(5)+","+(+v.lng).toFixed(5),c=seen[k]=(seen[k]||0)+1;let la=+v.lat,lo=+v.lng;if(c>1){const ang=c*2.4,r=0.00006*Math.sqrt(c);la+=r*Math.sin(ang);lo+=r*Math.cos(ang)}pts.push({v,la,lo,key:v.uid+"/"+v.id})});
 S.pts=pts;if(S.heat){m.removeLayer(S.heat);S.heat=null}S.pl.setPts(pts);
 if(S.heatOn&&window.L.heatLayer){m.removeLayer(S.pl);S.heat=L.heatLayer(pts.map(p=>[p.la,p.lo,1]),{radius:22,blur:18}).addTo(m)}else if(!m.hasLayer(S.pl))m.addLayer(S.pl);

function focusV(u,id){const p=S.pts.find(x=>x.key==u+"/"+id);if(!p)return alert("This visit has no GPS location.");S.map.setView([p.la,p.lo],17,{animate:false});S.sel=[p.v.lat,p.v.lng];L.popup({maxWidth:320,minWidth:250,offset:[0,-24]}).setLatLng([p.la,p.lo]).setContent(pop(p.v)).openOn(S.map);$("#mpw").scrollIntoView({behavior:"smooth",block:"center"})}
/* repeat visits: explains total records vs unique dealers */
function repeats(a){const g={};a.forEach(v=>{const k=dk(v.mainid||v.store);(g[k]=g[k]||[]).push(v)});const rep=Object.values(g).filter(l=>l.length>1).sort((x,y)=>y.length-x.length),extra=rep.reduce((s,l)=>s+l.length-1,0);

/* data stamp + manual refresh (no more timed reloads) */
function stamp(){const e=document.querySelector("#ptr");if(!e)return;const t=new Date(admin?S.lt||Date.now():S.ot||Date.now());e.innerHTML=`<span class="stamp">${admin&&S.visits.length?fmt(S.visits.length)+" visits in database &middot; ":""}Data as of ${t.toLocaleTimeString()}</span><button class="btn g sm" onclick="refreshData()">Refresh</button>`}

/* ===== v5.1: data health ===== */
const sigOf=v=>{const{id,at,by,uid,imported,edited_by,edited_at,vc,...r}=v;return hsh(r)},sigF=f=>{const{id,by,uid,imported,edited_by,edited_at,vc,...r}=f;return hsh(r)};
function health(){const V=S.visits,F=S.fus,imp=V.filter(v=>v.uid=="import"),g={},fg={};imp.forEach(v=>(g[sigOf(v)]=g[sigOf(v)]||[]).push(v));F.filter(f=>f.uid=="import").forEach(f=>(fg[sigF(f)]=fg[sigF(f)]||[]).push(f));

 return{V,imp,team:V.length-imp.length,noId:V.filter(v=>!String(v.mainid||"").trim()).length,uniq:new Set(V.map(v=>dk(v.mainid||v.store))).size,dv,df,rv:cnt2(dv),rf:cnt2(df)}}
function healthCard(){const h=health(),tot=h.rv+h.rf;
 return`<div class="card"><h3>Data health</h3><div class="kpis">${kpx(fmt(h.V.length),"Visit records",fmt(h.imp.length)+" imported &middot; "+fmt(h.team)+" submitted in the portal")+kpx(fmt(h.uniq),"Unique dealers",fmt(h.V.length-h.uniq)+" repeat records")+kpx(fmt(h.rv),"Duplicate imported visits","identical except import time")+kpx(fmt(h.rf),"Duplicate imported follow-ups","identical copies")+kpx(fmt(h.noId),"Visits without Dealer Main ID","counted by store name")}</div>
 <p style="margin-top:0"><b>Dealers visited</b> counts each Dealer Main ID once. <b>Visit records</b> counts every submission. They only match when every dealer was visited exactly once. If the same file was imported more than once, the copies show here as exact duplicates.</p><button class="btn" id="hrm" ${tot?"":"disabled"}>Remove ${fmt(tot)} duplicate imported rows</button> <span id="hmsg"></span></div>`}
function healthBind(){const b=document.querySelector("#hrm");if(!b)return;b.onclick=async()=>{const h=health(),tot=h.rv+h.rf;if(!tot||!confirm("Remove "+tot+" exact duplicate imported rows? One copy of each is kept."))return;b.disabled=true;let n=0;const m=document.querySelector("#hmsg");
  for(const[groups,seg]of[[h.dv,"list"],[h.df,"fu"]])for(const l of groups){const keep=l.slice().sort((a,c)=>String(a.id).localeCompare(String(c.id)))[0];for(const x of l)if(x!==keep){await db.doc("visits/import/"+seg+"/"+x.id).del();n++;m.textContent="Removed "+n+" of "+tot}}
  await load();S.lt=Date.now();await rebuild();await log("Duplicates removed",n+" imported rows");vImp()}}

/* ===== v6: regional-lead performance, wilayat accuracy, interactive background ===== */
const TW=()=>Object.values(WIL).reduce((s,w)=>s+w.length,0),validPairs=a=>new Set(a.filter(v=>v.wil&&WIL[v.gov]&&WIL[v.gov].includes(v.wil)).map(v=>v.gov+"|"+v.wil)).size;
function unm(a){const o={};a.forEach(v=>{if(v.wil&&v.gov&&WIL[v.gov]&&!WIL[v.gov].includes(v.wil)){const k=v.gov+" \u203a "+v.wil;o[k]=(o[k]||0)+1}});const e=Object.entries(o).sort((x,y)=>y[1]-x[1]);return e.length?`<p class="warn"><b>${e.length} wilayat name(s) are not in the official list</b> and are not counted in coverage: ${e.slice(0,8).map(([k,n])=>esc(k)+" ("+n+")").join(", ")}${e.length>8?"&hellip;":""}</p>`:""}
function perf(a){const n=new Date(),by={};a.forEach(v=>{const k=v.lead||"Unassigned";(by[k]=by[k]||[]).push(v)});const tot=a.length||1,
 rows=Object.entries(by).map(([k,l])=>({k,l,n:l.length,d:l.filter(v=>sameDay(v.at,n)).length,m:l.filter(v=>inMonth(v.at,n)).length,g:new Set(l.map(v=>v.gov).filter(Boolean)).size,w:validPairs(l),last:l.reduce((x,v)=>v.at>x?v.at:x,"")})).sort((x,y)=>y.n-x.n);
 return`<div class="wrap"><table class="pf"><tr><th>#</th><th>Regional lead</th><th>Visits</th><th>Share</th><th>Today</th><th>This month</th><th>Governorates</th><th>Wilayats</th><th>Last visit</th><th>14 days</th></tr>${rows.map((r,i)=>`<tr><td><span class="rk r${i<3?i+1:0}">${i+1}</span></td><td><div class="pu"><div class="av">${esc((String(r.k)[0]||"?").toUpperCase())}</div><b>${esc(r.k)}</b></div></td><td><b>${fmt(r.n)}</b></td><td style="min-width:120px"><div class="bt"><i style="width:${Math.max(2,r.n/rows[0].n*100)}%"></i></div><small>${pct(r.n,tot)}%</small></td><td>${r.d}</td><td>${r.m}</td><td>${r.g} / ${Object.keys(WIL).length}</td><td>${r.w} / ${TW()}</td><td>${r.last?rel(r.last):""}</td><td>${spark(r.l)}</td></tr>`).join("")||"<tr><td>No data</td></tr>"}</table></div>`}
/* interactive network background: reacts to the cursor, click ripples, travelling data packets */
(function(){try{const c=document.createElement("canvas");c.id="bgc";document.body.appendChild(c);const w=document.createElement("img");w.id="wm";w.alt="";w.src=LOGO;document.body.appendChild(w);
 const x=c.getContext("2d"),D=Math.min(2,window.devicePixelRatio||1),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;let W,H,P=[],K=[],R=[],mx=-999,my=-999,raf,T=0;
 const size=()=>{W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+"px";c.style.height=H+"px";x.setTransform(D,0,0,D,0,0);const n=W<700?30:Math.min(90,Math.round(W*H/17000));while(P.length<n){const r=Math.random();P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:r<.12?4.6:1.8+Math.random()*2.2,hub:r<.12,col:r>.92?"255,170,0":r>.8?"40,40,52":"230,0,0"})}P.length=n};
 addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY},{passive:true});addEventListener("pointerdown",e=>{R.push({x:e.clientX,y:e.clientY,t:0},{x:e.clientX,y:e.clientY,t:-10})},{passive:true});document.addEventListener("pointerleave",()=>{mx=my=-999});
 const draw=()=>{T++;x.clearRect(0,0,W,H);
  for(const p of P){const dx=mx-p.x,dy=my-p.y,d=Math.hypot(dx,dy);if(d<220&&d>2){p.vx+=dx/d*.014;p.vy+=dy/d*.014}
   for(const q of R)if(q.t>0){const rd=Math.hypot(p.x-q.x,p.y-q.y);if(Math.abs(rd-q.t*5)<22&&rd>1){p.vx+=(p.x-q.x)/rd*.18;p.vy+=(p.y-q.y)/rd*.18}}
   p.vx*=.992;p.vy*=.992;const sp=Math.hypot(p.vx,p.vy);if(sp>1){p.vx/=sp;p.vy/=sp}if(sp<.07){p.vx+=(Math.random()-.5)*.03;p.vy+=(Math.random()-.5)*.03}
   p.x+=p.vx;p.y+=p.vy;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20}
  const E=[];for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<175){E.push([a,b]);x.strokeStyle="rgba(230,0,0,"+((1-d/175)*.26)+")";x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
  if(mx>-900)for(const p of P){const d=Math.hypot(p.x-mx,p.y-my);if(d<200){x.strokeStyle="rgba(230,0,0,"+((1-d/200)*.6)+")";x.lineWidth=1.4;x.beginPath();x.moveTo(mx,my);x.lineTo(p.x,p.y);x.stroke()}}
  if(!rm&&T%12==0&&E.length&&K.length<16)K.push({e:E[Math.floor(Math.random()*E.length)],t:0});
  K=K.filter(k=>(k.t+=.025)<1);for(const k of K){const px=k.e[0].x+(k.e[1].x-k.e[0].x)*k.t,py=k.e[0].y+(k.e[1].y-k.e[0].y)*k.t,g=x.createRadialGradient(px,py,0,px,py,9);g.addColorStop(0,"rgba(230,0,0,.85)");g.addColorStop(1,"rgba(230,0,0,0)");x.fillStyle=g;x.beginPath();x.arc(px,py,9,0,6.283);x.fill()}
  for(const p of P){if(p.hub){const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,18);g.addColorStop(0,"rgba(230,0,0,.22)");g.addColorStop(1,"rgba(230,0,0,0)");x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,18,0,6.283);x.fill()}x.fillStyle="rgba("+p.col+","+(p.hub?.7:.5)+")";x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
  R=R.filter(q=>++q.t<62);for(const q of R)if(q.t>0){x.strokeStyle="rgba(230,0,0,"+((1-q.t/62)*.55)+")";x.lineWidth=2;x.beginPath();x.arc(q.x,q.y,q.t*5,0,6.283);x.stroke()}

 size();addEventListener("resize",size);if(rm){draw();cancelAnimationFrame(raf)}else draw();document.addEventListener("visibilitychange",()=>{cancelAnimationFrame(raf);if(!document.hidden&&!rm)draw()});
